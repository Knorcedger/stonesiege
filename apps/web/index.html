<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>StoneSiege</title>

      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b08; touch-action: none; }

        --bf-safe-area-left: env(safe-area-inset-left, 0px);

        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding-top: var(--bf-safe-area-top);
        padding-right: var(--bf-safe-area-right);
        padding-bottom: var(--bf-safe-area-bottom);
        padding-left: var(--bf-safe-area-left);
      }
      canvas { display: block; }
    </style>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
